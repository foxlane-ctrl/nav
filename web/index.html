<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="logo">我的<span>导航</span></div>
  </nav>

  <main class="main">
    <div class="adminbar" id="adminbar">
      <button id="btn-login">管理员登录</button>
    </div>

    <div class="clock">
      <div class="time" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </div>

    <form class="search" action="https://www.google.com/search" method="get" target="_blank">
      <select aria-label="搜索引擎" onchange="this.form.action=this.value">
        <option value="https://www.google.com/search">Google</option>
        <option value="https://www.bing.com/search">Bing</option>
        <option value="https://www.baidu.com/s">百度</option>
      </select>
      <input type="text" name="q" placeholder="搜索站点，或回车用所选引擎搜索" autocomplete="off">
      <button type="submit">搜索</button>
    </form>

    <div id="sections"></div>

    <p class="foot">我的导航 · Go 后端 + 前端 · 登录管理员后可直接加链接</p>
  </main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="modal-title">管理员登录</h3>
    <div id="modal-body"></div>
    <p class="err" id="modal-err"></p>
    <div class="row">
      <button id="modal-ok">确定</button>
      <button class="ghost" id="modal-cancel">取消</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
