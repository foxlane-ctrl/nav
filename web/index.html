<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1917">
<meta name="description" content="Sean's Nav — AI, daily sites, speed tests, VPS, mail and domains, all in one place.">
<title>Sean's Nav</title>
<script>
  // 三个主题：pond（锦鲤池塘，默认）/ mist（雾蓝）/ inkgold（墨金），各自独立。
  // 先按记住的主题上色，避免切换主题时闪一下默认页（和 XiaoWork Nav 同一个键 xn-theme）。
  // 旧值 dark 映射到墨金，旧值 light / morning 映射到雾蓝，未知值一律落到 pond。
  try {
    var stored = localStorage.getItem('xn-theme');
    if (stored === 'dark') stored = 'inkgold';
    if (stored === 'light' || stored === 'morning') stored = 'mist';
    if (stored !== 'mist' && stored !== 'inkgold' && stored !== 'pond') stored = 'pond';
    document.documentElement.dataset.theme = stored;
  } catch (e) { document.documentElement.dataset.theme = 'pond'; }
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="pond-canvas" aria-hidden="true"></canvas>
<div id="app" class="shell">
  <aside class="rail" id="rail" aria-label="分类导航">
    <div class="rail__brand">
      <a class="brand" href="/"><span class="brand__mark">S</span><span class="brand__title">Sean's Nav</span></a>
    </div>
    <div class="rail__head">
      <span class="rail__title">分类</span>
      <button type="button" class="rail__toggle" id="rail-toggle" title="折叠分类栏" aria-expanded="true"><span aria-hidden="true">«</span><span class="sr-only">折叠分类栏</span></button>
    </div>
    <nav class="rail__list" id="rail-list"></nav>
  </aside>

  <div class="shell__main">
    <div class="shell__topbar">
      <a class="brand shell__brand" href="/"><span class="brand__mark">S</span><span class="brand__title">Sean's Nav</span></a>
      <div class="header-actions">
        <div class="layout-switch" role="group" aria-label="导航布局">
          <button type="button" class="layout-switch__item is-active" id="layout-scroll" title="滚动模式：所有分类纵向排列，PC 端带左侧分类栏" aria-pressed="true"><span aria-hidden="true">☰</span><span class="layout-switch__label">滚动模式</span></button>
          <button type="button" class="layout-switch__item" id="layout-tabs" title="标签模式：顶部分类标签，一次只看一个分类" aria-pressed="false"><span aria-hidden="true">▤</span><span class="layout-switch__label">标签模式</span></button>
        </div>
        <select class="theme-picker__select" id="theme-picker" aria-label="切换视觉主题">
          <option value="pond">🐟 锦鲤池塘</option>
          <option value="mist">🌊 雾蓝</option>
          <option value="inkgold">🌑 墨金</option>
        </select>
        <span id="adminbar"></span>
      </div>
    </div>

    <div class="shell__content">
      <div class="page" id="page">
        <section class="clock" aria-label="时间">
          <div class="clock__time" id="clock-time">--:--:--</div>
          <div class="clock__date" id="clock-date"></div>
        </section>

        <div class="search">
          <form class="search__box" id="search-form" role="search">
            <select class="search__engine" id="search-engine" aria-label="搜索引擎">
              <option value="https://www.google.com/search?q={query}">Google</option>
              <option value="https://www.bing.com/search?q={query}">Bing</option>
              <option value="https://www.baidu.com/s?wd={query}">百度</option>
            </select>
            <input class="search__input" id="search-input" type="search" placeholder="搜索站点，或回车用所选引擎搜索" aria-label="搜索" autocomplete="off">
            <button type="submit" class="btn btn--sm btn--primary">搜索</button>
          </form>
        </div>

        <section class="ai-hero" aria-label="AI quick links">
          <span class="ai-hero__label">✦ AI</span>
          <a class="ai-hero__item ai-hero__item--muse" href="https://muse.ai" target="_blank" rel="noopener noreferrer">Muse</a>
          <a class="ai-hero__item" href="https://chat.openai.com" target="_blank" rel="noopener noreferrer">ChatGPT</a>
          <a class="ai-hero__item" href="https://claude.ai" target="_blank" rel="noopener noreferrer">Claude</a>
          <a class="ai-hero__item" href="https://gemini.google.com" target="_blank" rel="noopener noreferrer">Gemini</a>
        </section>

        <nav class="chipbar" id="chipbar" aria-label="分类快速跳转"></nav>
        <div class="tabs" id="tabs" hidden></div>
        <div id="search-results" hidden></div>
        <div id="sections"></div>
        <p class="foot">Sean's Nav · Go backend + frontend · Log in as admin to add links</p>
      </div>
    </div>
  </div>
</div>

<div class="modal-wrap" id="modal">
  <div class="modal">
    <h3 id="modal-title">管理员登录</h3>
    <div id="modal-body"></div>
    <p class="err" id="modal-err"></p>
    <div class="row">
      <button class="btn btn--primary" id="modal-ok" type="button">确定</button>
      <button class="btn" id="modal-cancel" type="button">取消</button>
    </div>
  </div>
</div>

<script src="/iconmap.js"></script>
<script src="/app.js"></script>
</body>
</html>
