<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="我的导航 — 常用站点、测速、AI、VPS、邮箱，一处直达。">
<title>我的导航</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark">✦</span>我的<span>导航</span></div>
    <p class="side-label">分类</p>
  </nav>

  <main class="main">
    <div class="adminbar" id="adminbar">
      <button id="btn-login">管理员登录</button>
    </div>

    <header class="hero">
      <div class="clock">
        <div class="time" id="clock">--:--:--</div>
        <div class="date" id="date"></div>
      </div>

      <form class="search" action="https://www.google.com/search" method="get" target="_blank">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="text" name="q" placeholder="搜索站点，或输入关键词回车搜索" autocomplete="off" aria-label="搜索">
        <select aria-label="搜索引擎" onchange="this.form.action=this.value">
          <option value="https://www.google.com/search">Google</option>
          <option value="https://www.bing.com/search">Bing</option>
          <option value="https://www.baidu.com/s">百度</option>
        </select>
        <button type="submit">搜索</button>
      </form>
    </header>

    <div id="sections"></div>

    <p class="foot">我的导航 · Go 后端 + 前端 · 登录管理员后可直接加链接</p>
  </main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="modal-title">管理员登录</h3>
    <div id="modal-body"></div>
    <p class="err" id="modal-err"></p>
    <div class="row">
      <button id="modal-ok">确定</button>
      <button class="ghost" id="modal-cancel">取消</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
