services:
  navsite:
    build: .
    image: navsite:latest
    container_name: nav-site
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 部署后务必改掉默认密码：改下面这一行，或用 .env 文件覆盖。
      NAV_ADMIN_USER: ${NAV_ADMIN_USER:-admin}
      NAV_ADMIN_PASSWORD: ${NAV_ADMIN_PASSWORD:-change-me}
      PORT: "8080"
    volumes:
      - navsite-data:/app/data

volumes:
  navsite-data:
